<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed & Basma's Engagement</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* تم ربط اسم الصورة بدقة هنا */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('IMG-20261009-WA0002.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 100%;
            max-width: 480px;
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #f3e5ab;
            font-size: 2.8rem;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 1rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .details {
            background: rgba(0, 0, 0, 0.35);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: left;
            border-left: 4px solid #f3e5ab;
        }
        .details p {
            margin: 8px 0;
            font-size: 1rem;
            color: #f5f5f5;
        }
        .details strong {
            color: #f3e5ab;
        }
        .countdown {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        .time-box {
            background: rgba(243, 229, 171, 0.15);
            border: 1px solid rgba(243, 229, 171, 0.3);
            color: #fff;
            padding: 12px 8px;
            border-radius: 12px;
            width: 75px;
        }
        .time-box span {
            display: block;
            font-size: 1.4rem;
            font-weight: 700;
            color: #f3e5ab;
        }
        .time-box label {
            font-size: 0.75rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e6c547, #b8860b);
        }
        .footer-note {
            mt: 25px;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Mohammed & Basma</h1>
        <p class="subtitle">Engagement Invitation</p>

        <div class="details">
            <p><strong>Date:</strong> Thursday, Oct 15, 2026</p>
            <p><strong>Time:</strong> 7:00 PM</p>
            <p><strong>Venue:</strong> Al-Masa Hall, New Horeya Rd</p>
        </div>

        <!-- العداد التنازلي -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- زر الخريطة -->
        <a href="https://maps.app.goo.gl/GaNHBGjJ3XEsS8NcA" target="_blank" class="btn">📍 Open Location on Map</a>
        
        <p class="footer-note">We would be honored by your presence ✨</p>
    </div>

    <script>
        const eventDate = new Date("October 15, 2026 19:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h3>The Celebration Has Begun! 🎉</h3>";
                return;
            }

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>

</body>
</html>
