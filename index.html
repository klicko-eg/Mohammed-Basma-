<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed & Basma's Engagement</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.75)), url('IMG-20261009-WA0002.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* شاشة الغلاف الأسطورية الفخمة */
        #cover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 20px;
        }

        .cover-box {
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid rgba(243, 229, 171, 0.6);
            padding: 40px 30px;
            border-radius: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(243, 229, 171, 0.15);
            max-width: 420px;
            width: 100%;
        }

        .gift-box {
            font-size: 4.5rem;
            animation: pulseGlow 2s infinite ease-in-out;
            cursor: pointer;
            margin-bottom: 15px;
            user-select: none;
            filter: drop-shadow(0 0 15px rgba(243, 229, 171, 0.5));
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .cover-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #f3e5ab;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .cover-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            color: #d1d1d1;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .open-btn {
            background: linear-gradient(135deg, #f3e5ab, #d4af37, #aa771c);
            color: #111;
            border: none;
            padding: 14px 35px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .open-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.7);
        }

        #heart-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
        }

        /* كارت الدعوة الرئيسي */
        .invitation-card {
            background: rgba(12, 12, 12, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            width: 100%;
            max-width: 450px;
            padding: 40px 25px;
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(243, 229, 171, 0.5);
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
        }
        .show-card .invitation-card {
            opacity: 1;
            transform: translateY(0);
        }

        .top-tag {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            letter-spacing: 6px;
            color: #f3e5ab;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 700;
        }
        h1 {
            font-family: 'Great Vibes', cursive;
            color: #fff;
            font-size: 3.8rem;
            margin-bottom: 5px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
            font-weight: 400;
        }
        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .event-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 22px;
            text-align: left;
            border-left: 4px solid #f3e5ab;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 10px 0;
        }
        .event-row .label {
            color: #b5b5b5;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            min-width: 65px;
        }
        .event-row .value {
            color: #f3e5ab;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: right;
            letter-spacing: 0.5px;
        }
        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 22px;
        }
        .time-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(243, 229, 171, 0.35);
            color: #fff;
            padding: 12px 4px;
            border-radius: 14px;
            flex: 1;
        }
        .time-box span {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            color: #f3e5ab;
            font-family: 'Playfair Display', serif;
        }
        .time-box label {
            font-size: 0.6rem;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f3e5ab, #d4af37, #aa771c);
            color: #111;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.8);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ddd;
            letter-spacing: 1.5px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        #youtube-audio-container {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- مشغل الصوت المخفي للأغنية الجديدة بدون إعلانات -->
    <div id="youtube-audio-container">
        <iframe id="ytPlayer" width="1" height="1" src="" frameborder="0" allow="autoplay"></iframe>
    </div>

    <canvas id="heart-canvas"></canvas>

    <!-- شاشة الغلاف الأسطورية الفخمة -->
    <div id="cover-screen">
        <div class="cover-box">
            <div class="gift-box" onclick="openInvitation()">🎁</div>
            <div class="cover-title">Mohammed & Basma</div>
            <div class="cover-subtitle">Engagement Celebration</div>
            <button class="open-btn" onclick="openInvitation()">Open Invitation ✨</button>
        </div>
    </div>

    <!-- كارت الدعوة الرئيسي -->
    <div class="invitation-card" id="mainCard">
        <div class="top-tag">Save The Date</div>
        <h1>Mohammed & Basma</h1>
        <p class="subtitle">Engagement Celebration</p>

        <div class="event-box">
            <div class="event-row">
                <span class="label">Date:</span>
                <span class="value">Thursday, Oct 15</span>
            </div>
            <div class="event-row">
                <span class="label">Time:</span>
                <span class="value">7:00 PM</span>
            </div>
            <div class="event-row">
                <span class="label">Venue:</span>
                <span class="value">Al-Masa Hall, New Heria Road, Zagazig</span>
            </div>
        </div>

        <!-- العداد التنازلي -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- زر الخريطة -->
        <a href="https://maps.app.goo.gl/GaNHBGjJ3XEsS8NcA" target="_blank" class="btn">View Venue Map 📍</a>
        
        <p class="footer-note">We would be honored by your presence ✨</p>
    </div>

    <script>
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createHeartParticles() {
            for (let i = 0; i < 45; i++) {
                hearts.push({
                    x: Math.random() * window.innerWidth,
                    y: window.innerHeight + Math.random() * 100,
                    size: Math.random() * 10 + 6,
                    speedY: Math.random() * 2 + 1.2,
                    speedX: (Math.random() - 0.5) * 1.5,
                    opacity: Math.random() * 0.7 + 0.3,
                    color: Math.random() > 0.4 ? '#f3e5ab' : '#ff3366'
                });
            }
        }

        function drawVectorHeart(x, y, size, color, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = opacity;
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            
            ctx.beginPath();
            let d = size;
            ctx.moveTo(0, d / 3);
            ctx.bezierCurveTo(-d, -d / 2, -d * 1.2, d / 2, 0, d * 1.5);
            ctx.bezierCurveTo(d * 1.2, d / 2, d, -d / 2, 0, d / 3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animateHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach((h, index) => {
                h.y -= h.speedY;
                h.x += h.speedX + Math.sin(h.y / 30) * 0.5;
                h.opacity -= 0.002;

                if (h.opacity <= 0 || h.y < -50) {
                    hearts.splice(index, 1);
                } else {
                    drawVectorHeart(h.x, h.y, h.size, h.color, h.opacity);
                }
            });
            requestAnimationFrame(animateHearts);
        }
        animateHearts();

        function openInvitation() {
            createHeartParticles();
            
            // تشغيل الأغنية الجديدة المطلوبة بدون إعلانات وتكرار تلقائي
            const ytPlayer = document.getElementById('ytPlayer');
            ytPlayer.src = "https://www.youtube.com/embed/ewTN1yxYaFA?autoplay=1&loop=1&playlist=ewTN1yxYaFA";

            const cover = document.getElementById('cover-screen');
            const body = document.body;

            cover.style.opacity = '0';
            cover.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                cover.style.display = 'none';
                body.classList.add('show-card');
            }, 800);
        }

        const eventDate = new Date("October 15, 2026 19:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h3>The Celebration Has Begun! 🎉</h3>";
                return;
            }

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>

</body>
</html>
