<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed & Basma's Engagement</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(rgba(5, 5, 5, 0.6), rgba(15, 10, 5, 0.8)), url('IMG-20261009-WA0002.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* إضاءة سينمائية خفيفة للخلفية */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* شاشة الغلاف الأسطورية */
        #cover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.97);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px;
        }
        .gift-box {
            font-size: 5.5rem;
            animation: pulseGlow 2s infinite ease-in-out;
            cursor: pointer;
            margin-bottom: 25px;
            user-select: none;
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.6));
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 45px rgba(212, 175, 55, 0.9)); }
        }
        .cover-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: #f3e5ab;
            margin-bottom: 8px;
            font-weight: 400;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .cover-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            color: #d1d1d1;
            letter-spacing: 5px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }
        .open-btn {
            background: linear-gradient(135deg, #f9f0cb, #d4af37, #996515);
            color: #111;
            border: none;
            padding: 16px 45px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(212, 175, 55, 0.4);
            transition: 0.4s;
            letter-spacing: 2px;
        }
        .open-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 15px 45px rgba(212, 175, 55, 0.8);
        }

        #heart-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
        }

        /* كارت الدعوة الأسطوري الفاخر */
        .invitation-card {
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 480px;
            padding: 50px 30px;
            border-radius: 40px;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.85), inset 0 0 25px rgba(243, 229, 171, 0.1);
            border: 1.5px solid rgba(243, 229, 171, 0.45);
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
            z-index: 3;
            position: relative;
        }
        .show-card .invitation-card {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .top-tag {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            letter-spacing: 8px;
            color: #f3e5ab;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 700;
        }
        h1 {
            font-family: 'Great Vibes', cursive;
            color: #fff;
            font-size: 4.2rem;
            margin-bottom: 5px;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9), 0 0 25px rgba(243, 229, 171, 0.5);
            font-weight: 400;
        }
        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 30px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .event-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 25px;
            border-radius: 22px;
            margin-bottom: 25px;
            text-align: left;
            border-left: 4px solid #f3e5ab;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.01);
        }
        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 14px 0;
        }
        .event-row .label {
            color: #b5b5b5;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            min-width: 75px;
        }
        .event-row .value {
            color: #f3e5ab;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 700;
            text-align: right;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }
        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 30px;
        }
        .time-box {
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(243, 229, 171, 0.35);
            color: #fff;
            padding: 14px 6px;
            border-radius: 18px;
            flex: 1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .time-box span {
            display: block;
            font-size: 1.45rem;
            font-weight: 700;
            color: #f3e5ab;
            font-family: 'Cormorant Garamond', serif;
        }
        .time-box label {
            font-size: 0.65rem;
            color: #bcbcbc;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 3px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f9f0cb, #d4af37, #996515);
            color: #111;
            text-decoration: none;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.4s;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.8);
        }
        .footer-note {
            margin-top: 25px;
            font-size: 0.95rem;
            color: #e5e5e5;
            letter-spacing: 2px;
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        
        #youtube-audio-container {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- مشغل الصوت الجديد نظيف تماماً بدون إعلانات -->
    <div id="youtube-audio-container">
        <iframe id="ytPlayer" width="1" height="1" src="" frameborder="0" allow="autoplay"></iframe>
    </div>

    <canvas id="heart-canvas"></canvas>

    <!-- شاشة الغلاف الأسطورية الفخمة -->
    <div id="cover-screen">
        <div class="gift-box" onclick="openInvitation()">🎁</div>
        <div class="cover-title">Mohammed & Basma</div>
        <div class="cover-subtitle">Engagement Celebration</div>
        <button class="open-btn" onclick="openInvitation()">✨ اضغط لفتح الدعوة</button>
    </div>

    <!-- كارت الدعوة الرئيسي -->
    <div class="invitation-card" id="mainCard">
        <div class="top-tag">Save The Date</div>
        <h1>Mohammed & Basma</h1>
        <p class="subtitle">Engagement Celebration</p>

        <div class="event-box">
            <div class="event-row">
                <span class="label">Date:</span>
                <span class="value">Thursday, Oct 15</span>
            </div>
            <div class="event-row">
                <span class="label">Time:</span>
                <span class="value">7:00 PM</span>
            </div>
            <div class="event-row">
                <span class="label">Venue:</span>
                <span class="value">Al-Masa Hall, New Heria Road, Zagazig</span>
            </div>
        </div>

        <!-- العداد التنازلي -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- زر الخريطة -->
        <a href="https://maps.app.goo.gl/GaNHBGjJ3XEsS8NcA" target="_blank" class="btn">📍 View Venue Map</a>
        
        <p class="footer-note">We would be honored by your presence ✨</p>
    </div>

    <script>
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createHeartParticles() {
            for (let i = 0; i < 50; i++) {
                hearts.push({
                    x: Math.random() * window.innerWidth,
                    y: window.innerHeight + Math.random() * 100,
                    size: Math.random() * 12 + 6,
                    speedY: Math.random() * 2.2 + 1.2,
                    speedX: (Math.random() - 0.5) * 1.5,
                    opacity: Math.random() * 0.7 + 0.3,
                    color: Math.random() > 0.35 ? '#f3e5ab' : '#ff3366'
                });
            }
        }

        function drawVectorHeart(x, y, size, color, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = opacity;
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;
            
            ctx.beginPath();
            let d = size;
            ctx.moveTo(0, d / 3);
            ctx.bezierCurveTo(-d, -d / 2, -d * 1.2, d / 2, 0, d * 1.5);
            ctx.bezierCurveTo(d * 1.2, d / 2, d, -d / 2, 0, d / 3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animateHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach((h, index) => {
                h.y -= h.speedY;
                h.x += h.speedX + Math.sin(h.y / 25) * 0.6;
                h.opacity -= 0.0018;

                if (h.opacity <= 0 || h.y < -50) {
                    hearts.splice(index, 1);
                } else {
                    drawVectorHeart(h.x, h.y, h.size, h.color, h.opacity);
                }
            });
            requestAnimationFrame(animateHearts);
        }
        animateHearts();

        function openInvitation() {
            createHeartParticles();
            
            // تشغيل الأغنية الجديدة بدقة وبدون إعلانات مع التكرار التلقائي
            const ytPlayer = document.getElementById('ytPlayer');
            ytPlayer.src = "https://www.youtube.com/embed/ewTN1yxYaFA?autoplay=1&loop=1&playlist=ewTN1yxYaFA";

            const cover = document.getElementById('cover-screen');
            const body = document.body;

            cover.style.opacity = '0';
            cover.style.transform = 'scale(1.12)';
            
            setTimeout(() => {
                cover.style.display = 'none';
                body.classList.add('show-card');
            }, 850);
        }

        const eventDate = new Date("October 15, 2026 19:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h3>The Celebration Has Begun! 🎉</h3>";
                return;
            }

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>

</body>
    </html>
