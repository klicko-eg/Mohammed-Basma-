<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed & Basma's Engagement</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.6)), url('IMG-20261009-WA0002.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* شاشة الغلاف وصندوق الهدية */
        #cover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 20px;
        }
        .gift-box {
            font-size: 5.5rem;
            animation: bounce 1.8s infinite;
            cursor: pointer;
            margin-bottom: 15px;
            text-shadow: 0 0 35px rgba(212, 175, 55, 0.7);
            user-select: none;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-18px); }
            60% { transform: translateY(-9px); }
        }
        .cover-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: #f3e5ab;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .cover-subtitle {
            font-size: 0.85rem;
            color: #ccc;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .open-btn {
            background: linear-gradient(135deg, #f3e5ab, #d4af37, #aa771c);
            color: #111;
            border: none;
            padding: 15px 38px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .open-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.8);
        }

        /* تأثير القلوب المتطايرة */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: flyUp 3s linear forwards;
            z-index: 9998;
            user-select: none;
            pointer-events: none;
        }
        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }

        /* كارت الدعوة الرئيسي */
        .invitation-card {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            width: 100%;
            max-width: 460px;
            padding: 45px 25px;
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(243, 229, 171, 0.5);
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease 0.3s;
        }
        .show-card .invitation-card {
            opacity: 1;
            transform: translateY(0);
        }

        .top-tag {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: #f3e5ab;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 600;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 2.8rem;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 15px rgba(243, 229, 171, 0.5);
            font-weight: 700;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #e0e0e0;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .event-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 22px;
            border-radius: 20px;
            margin-bottom: 25px;
            text-align: left;
            border-left: 4px solid #f3e5ab;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.03);
        }
        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 10px 0;
        }
        .event-row .label {
            color: #d1d1d1;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            min-width: 70px;
        }
        .event-row .value {
            color: #f3e5ab;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: right;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }
        .time-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(243, 229, 171, 0.4);
            color: #fff;
            padding: 12px 5px;
            border-radius: 15px;
            flex: 1;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }
        .time-box span {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            color: #f3e5ab;
            font-family: 'Cinzel', serif;
        }
        .time-box label {
            font-size: 0.65rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f3e5ab, #d4af37, #aa771c);
            color: #111;
            text-decoration: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.05rem;
            transition: 0.4s;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.8);
        }
        .footer-note {
            margin-top: 22px;
            font-size: 0.85rem;
            color: #eee;
            letter-spacing: 1px;
            font-style: italic;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- شاشة البداية وصندوق الهدية التفاعلي -->
    <div id="cover-screen">
        <div class="gift-box" onclick="openInvitation()">🎁</div>
        <div class="cover-title">Mohammed & Basma</div>
        <div class="cover-subtitle">Special Engagement Invitation</div>
        <button class="open-btn" onclick="openInvitation()">✨ اضغط لفتح الدعوة</button>
    </div>

    <!-- كارت الدعوة الرئيسي -->
    <div class="invitation-card" id="mainCard">
        <div class="top-tag">Save The Date</div>
        <h1>Mohammed & Basma</h1>
        <p class="subtitle">Engagement Celebration</p>

        <div class="event-box">
            <div class="event-row">
                <span class="label">Date:</span>
                <span class="value">Thursday, Oct 15</span>
            </div>
            <div class="event-row">
                <span class="label">Time:</span>
                <span class="value">7:00 PM</span>
            </div>
            <div class="event-row">
                <span class="label">Venue:</span>
                <span class="value">Al-Masa Hall, New Heria Road, Zagazig</span>
            </div>
        </div>

        <!-- العداد التنازلي -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- زر الخريطة -->
        <a href="https://maps.app.goo.gl/GaNHBGjJ3XEsS8NcA" target="_blank" class="btn">📍 View Venue Map</a>
        
        <p class="footer-note">We would be honored by your presence ✨</p>
    </div>

    <script>
        function createHearts() {
            const symbols = ['❤️', '✨', '💖', '⭐', '🌹', '💛'];
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 3000);
            }
        }

        function openInvitation() {
            createHearts();
            const cover = document.getElementById('cover-screen');
            const body = document.body;

            cover.style.opacity = '0';
            cover.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                cover.style.display = 'none';
                body.classList.add('show-card');
            }, 800);
        }

        const eventDate = new Date("October 15, 2026 19:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h3>The Celebration Has Begun! 🎉</h3>";
                return;
            }

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>

</body>
</html>
