<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Engagement | Mohammed & Basma</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alex+Brush&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .invitation-card {
            background: rgba(20, 20, 20, 0.95);
            width: 100%;
            max-width: 480px;
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(212, 175, 55, 0.4);
            position: relative;
            overflow: hidden;
        }
        .invitation-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #d4af37, #fff, #d4af37);
        }
        /* إطار صورة بوكيه الورد */
        .photo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .top-tag {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        h1 {
            font-family: 'Alex Brush', cursive;
            color: #fff;
            font-size: 3.2rem;
            margin-bottom: 2px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }
        .subtitle {
            font-size: 0.9rem;
            color: #dcdcdc;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .event-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 25px;
            text-align: left;
            border-left: 3px solid #d4af37;
        }
        .event-box p {
            margin: 8px 0;
            font-size: 0.95rem;
            color: #f1f1f1;
            display: flex;
            justify-content: space-between;
        }
        .event-box strong {
            color: #d4af37;
            font-family: 'Cinzel', serif;
        }
        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }
        .time-box {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #fff;
            padding: 10px 5px;
            border-radius: 14px;
            flex: 1;
        }
        .time-box span {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
            color: #d4af37;
            font-family: 'Cinzel', serif;
        }
        .time-box label {
            font-size: 0.65rem;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.4s;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e6c547, #d4af37);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 1px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <!-- صورة بوكيه الورد بارزة في المنتصف -->
        <div class="photo-container">
            <img src="IMG-20261009-WA0002.jpg" alt="Engagement Photo">
        </div>

        <div class="top-tag">Save The Date</div>
        <h1>Mohammed & Basma</h1>
        <p class="subtitle">Engagement Celebration</p>

        <div class="event-box">
            <p><span>Date:</span> <strong>Thursday, Oct 15</strong></p>
            <p><span>Time:</span> <strong>7:00 PM</strong></p>
            <p><span>Venue:</span> <strong>Al-Masa Hall, New Heria Rd, Zagazig</strong></p>
        </div>

        <!-- العداد التنازلي -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- زر الخريطة -->
        <a href="https://maps.app.goo.gl/GaNHBGjJ3XEsS8NcA" target="_blank" class="btn">📍 View Venue Map</a>
        
        <p class="footer-note">We would be honored by your presence ✨</p>
    </div>

    <script>
        const eventDate = new Date("October 15, 2026 19:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h3>The Celebration Has Begun! 🎉</h3>";
                return;
            }

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>

</body>
</html>
