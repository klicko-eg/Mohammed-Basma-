<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Engagement | Mohammed & Basma</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* خلفية بوكيه الورد مالية الشاشة بالكامل وبشكل فخم */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), url('IMG-20261009-WA0002.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .invitation-card {
            background: rgba(12, 12, 12, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            width: 100%;
            max-width: 480px;
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.85);
            border: 1px solid rgba(212, 175, 55, 0.45);
            position: relative;
            overflow: hidden;
        }
        .invitation-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #d4af37, #fff, #d4af37);
        }
        .top-tag {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        h1 {
            font-family: 'Great Vibes', cursive;
            color: #fff;
            font-size: 4rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 20px rgba(212, 175, 55, 0.6);
            font-weight: 400;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #dcdcdc;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .event-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 22px;
            border-radius: 18px;
            margin-bottom: 25px;
            text-align: left;
            border-left: 3px solid #d4af37;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
        }
        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 10px 0;
        }
        .event-row .label {
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            min-width: 70px;
        }
        .event-row .value {
            color: #f3e5ab;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: right;
        }
        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }
        .time-box {
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: #fff;
            padding: 12px 5px;
            border-radius: 14px;
            flex: 1;
        }
        .time-box span {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            color: #f3e5ab;
            font-family: 'Cinzel', serif;
        }
        .time-box label {
            font-size: 0.65rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: 0.4s;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e6c547, #d4af37);
        }
        .footer-note {
            margin-top: 22px;
            font-size: 0.85rem;
            color: #ccc;
            letter-spacing: 1px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="top-tag">Save The Date</div>
        <h1>Mohammed & Basma</h1>
        <p class="subtitle">Engagement Celebration</p>

        <div class="event-box">
            <div class="event-row">
                <span class="label">Date:</span>
                <span class="value">Thursday, Oct 15</span>
            </div>
            <div class="event-row">
                <span class="label">Time:</span>
                <span class="value">7:00 PM</span>
            </div>
            <div class="event-row">
                <span class="label">Venue:</span>
                <span class="value">Al-Masa Hall, New Heria Road, Zagazig</span>
            </div>
        </div>

        <!-- العداد التنازلي -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- زر الخريطة -->
        <a href="https://maps.app.goo.gl/GaNHBGjJ3XEsS8NcA" target="_blank" class="btn">📍 View Venue Map</a>
        
        <p class="footer-note">We would be honored by your presence ✨</p>
    </div>

    <script>
        const eventDate = new Date("October 15, 2026 19:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown").innerHTML = "<h3>The Celebration Has Begun! 🎉</h3>";
                return;
            }

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>

</body>
</html>
